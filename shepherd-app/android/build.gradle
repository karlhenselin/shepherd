// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.1.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// @idleflowgames/capacitor-play-games uses a `kotlin {}` block but never applies
// the Kotlin plugin. Apply it as soon as that module applies the Android library plugin.
gradle.beforeProject { project ->
    if (project.name == 'idleflowgames-capacitor-play-games') {
        project.plugins.withId('com.android.library') {
            project.pluginManager.apply('org.jetbrains.kotlin.android')
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
